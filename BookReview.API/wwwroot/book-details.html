<!DOCTYPE html>
<html lang="sr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Detalji knjige - BookReview
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>



    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="/index.html">
                BookReview
            </a>


            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse"
                 id="navbarContent">

                <div class="navbar-nav ms-auto"
                     id="navbarLinks">
                </div>

            </div>

        </div>

    </nav>




    <main class="container py-5">


        

        <div id="bookDetails">

            <div class="text-center py-5">

                <div class="spinner-border"></div>

                <p class="mt-2">
                    Učitavanje knjige...
                </p>

            </div>

        </div>



        <hr class="my-5">



        <!-- REVIEWS -->

        <section>

            <h2 class="mb-4">
                Recenzije
            </h2>

            <div id="reviewsContainer">
            </div>

        </section>



        <!-- REVIEW FORM -->

        <section id="reviewSection"
                 class="mt-5">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4 class="mb-4">
                        Napiši recenziju
                    </h4>


                    <form id="reviewForm">


                        <!-- TITLE -->

                        <div class="mb-3">

                            <label for="reviewTitle"
                                   class="form-label">
                                Naslov
                            </label>

                            <input type="text"
                                   id="reviewTitle"
                                   class="form-control"
                                   required>

                        </div>



                        <!-- TEXT -->

                        <div class="mb-3">

                            <label for="reviewText"
                                   class="form-label">
                                Recenzija
                            </label>

                            <textarea id="reviewText"
                                      class="form-control"
                                      rows="5"
                                      required></textarea>

                        </div>



                        <!-- RATING -->

                        <div class="mb-3">

                            <label for="reviewRating"
                                   class="form-label">
                                Ocena
                            </label>

                            <select id="reviewRating"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Izaberi ocenu
                                </option>

                                <option value="1">
                                    1 ★
                                </option>

                                <option value="2">
                                    2 ★★
                                </option>

                                <option value="3">
                                    3 ★★★
                                </option>

                                <option value="4">
                                    4 ★★★★
                                </option>

                                <option value="5">
                                    5 ★★★★★
                                </option>

                            </select>

                        </div>



                        

                        <button type="submit"
                                class="btn btn-primary">
                            Objavi recenziju
                        </button>

                    </form>



                    <div id="reviewMessage"
                         class="mt-3">
                    </div>

                </div>

            </div>

        </section>


    </main>




    <script src="/js/api.js"></script>

    <script src="/js/books.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
