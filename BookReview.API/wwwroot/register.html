<!DOCTYPE html>
<html lang="sr">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registracija - BookReview</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="/index.html">
                BookReview
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                 id="navbarContent">

                <div class="navbar-nav ms-auto"
                     id="navbarLinks">
                </div>

            </div>

        </div>

    </nav>


    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Registracija
                        </h2>


                        <div id="registerMessage">
                        </div>


                        <form id="registerForm">

                            <div class="mb-3">

                                <label for="username"
                                       class="form-label">
                                    Korisničko ime
                                </label>

                                <input type="text"
                                       id="username"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label for="email"
                                       class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       id="email"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label for="firstName"
                                       class="form-label">
                                    Ime
                                </label>

                                <input type="text"
                                       id="firstName"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label for="lastName"
                                       class="form-label">
                                    Prezime
                                </label>

                                <input type="text"
                                       id="lastName"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label for="password"
                                       class="form-label">
                                    Lozinka
                                </label>

                                <input type="password"
                                       id="password"
                                       class="form-control"
                                       required>

                            </div>


                            <button type="submit"
                                    class="btn btn-primary w-100">
                                Registruj se
                            </button>

                        </form>


                        <p class="text-center mt-3 mb-0">

                            Već imaš nalog?

                            <a href="/login.html">
                                Prijavi se
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
